[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mooselabs/countersign"
authors = ["Patrick McEvoy <patrick.mcevoy@moose.run>"]

[workspace.dependencies]
aho-corasick = "1.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
rpassword = "7"
rustix = { version = "1", features = ["net", "process", "system", "fs"] }
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"

countersign-proto = { path = "crates/countersign-proto" }
countersign-core = { path = "crates/countersign-core" }
countersign-approve = { path = "crates/countersign-approve" }
countersign-hide = { path = "crates/countersign-hide" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
