[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mooselabs/countersign"
authors = ["Patrick McEvoy <patrick.mcevoy@moose.run>"]

[workspace.dependencies]
aho-corasick = "1.1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.3"
glob = "0.3"
hkdf = "0.12"
humantime = "2"
regex = "1"
rpassword = "7"
rustix = { version = "1", features = ["net", "process", "system", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
toml = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1.8"
zvariant = "5"

countersign-proto = { path = "crates/countersign-proto" }
countersign-core = { path = "crates/countersign-core" }
countersign-approve = { path = "crates/countersign-approve" }
countersign-hide = { path = "crates/countersign-hide" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"

# Argon2id (cnd init and recover) takes seconds unoptimised; tests run it.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
