name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds.
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The approve crate's tests start a private dbus-daemon with a fake
      # polkit authority; they never talk to the runner's system bus.
      - name: dbus-daemon for the private-bus tests
        run: |
          if ! command -v dbus-daemon >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends dbus-daemon ||
              sudo apt-get install -y --no-install-recommends dbus
          fi
          dbus-daemon --version | head -n 1
      - run: cargo fmt --all --check
      # insecure-test is debug-only (a release build with it fails to
      # compile); clippy and test build debug.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      # The release build install.sh expects, without the test feature.
      - run: cargo check --workspace --release --locked

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck packaging/*.sh packaging/lib/*.sh packaging/tests/*.sh
      - name: install.sh and uninstall.sh dry-run plans
        run: bash packaging/tests/dry-run.sh
      - name: release tarball and the one-line installer
        run: bash packaging/tests/get.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries a Signed-off-by line
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | awk 'NF < 2 {print $1}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi
