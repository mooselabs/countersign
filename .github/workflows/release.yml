name: release

# A tag vX.Y.Z publishes release X.Y.Z: the CI checks, a release build on
# Ubuntu 22.04 (glibc 2.35, so the binaries run on newer distributions), the
# tarball and the one-line installer with their SHA-256 sums and build
# provenance attestations, and the GitHub release. See packaging/README.md,
# "Install from a release".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: The tag is v + the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml)
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version '$version' in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]+\]: / { if (on) exit }
            on' CHANGELOG.md >out/notes.md
          if ! grep -q '[^[:space:]]' out/notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat out/notes.md
      # No insecure-test feature: it does not compile in a release build.
      - name: Build
        run: |
          rustc --version
          cargo build --release --locked
      - name: cn and cnd link only glibc
        run: |
          for bin in target/release/cn target/release/cnd; do
            echo "== $bin"
            ldd "$bin"
            needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            for lib in $needed; do
              case $lib in
              libc.so.6 | libm.so.6 | libgcc_s.so.1 | ld-linux-x86-64.so.2 | libpthread.so.0 | libdl.so.2 | librt.so.1 | libutil.so.1) ;;
              *) echo "::error::$bin needs $lib, which is not part of glibc"; exit 1 ;;
              esac
            done
            glibc=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
            echo "needs $needed; newest symbol version $glibc"
          done
      - name: Tarball, installer and SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          bash packaging/make-release-tarball.sh --version "$VERSION" --bin-dir target/release --out-dir out/assets
          cat out/assets/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Check the sums
        working-directory: out/assets
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/assets/countersign-${{ needs.build.outputs.version }}-x86_64-linux.tar.gz
            out/assets/install.sh
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=()
          case $VERSION in *-*) prerelease=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "countersign $VERSION" --notes-file out/notes.md "${prerelease[@]}" \
            "out/assets/countersign-$VERSION-x86_64-linux.tar.gz" \
            out/assets/SHA256SUMS \
            out/assets/install.sh
